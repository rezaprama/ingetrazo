# SPDX-License-Identifier: GPL-3.0-or-later
# Run the fast test suite on every pull request and on every push to main
# (in the private development repository: pull requests and manual runs only).
#
# This is the gate the release workflows don't provide: build-windows.yml and
# release.yml only fire on a vX.Y.Z tag, so until now a PR showed "no checks
# reported" no matter what it broke. With this in place a contributor's PR
# gets a green check or a red cross without anyone reading the code first.
#
# Same recipe as release.yml's test step (ubuntu-22.04, Python 3.12, the
# "not slow" marker), minus everything packaging-related: no pyinstaller, no
# fuse/appimagetool, no xvfb — the tests that need Qt set (or we export)
# QT_QPA_PLATFORM=offscreen, so no display is required.
name: verify exact mesh copy

on:
  pull_request:
  push:
    branches: [ci/verify-exact-mesh-copy]
  workflow_dispatch:        # manual runs from the Actions tab

# A force-push to a PR branch cancels the now-obsolete run instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # tests only ever read the checkout

jobs:
  tests:
    name: pytest (not slow), batch ${{ matrix.batch }}
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    # In the private development repository Actions minutes are counted, and a
    # push to main has already passed both suites locally before it went up:
    # there the gate runs on pull requests (and by hand) only. The public
    # repository keeps every trigger — its minutes are free.
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        timeout-minutes: 3
        run: |
          # The mirror's resolver failed during this one-off verification.
          # This archive address was independently resolved on 2026-11-11;
          # HTTPS certificates and apt's package hashes still verify downloads.
          if ! timeout 5 getent ahostsv4 archive.ubuntu.com; then
            printf '%s\n' '185.125.190.83 archive.ubuntu.com' | sudo tee -a /etc/hosts
          fi
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Python dependencies
        # Straight from requirements.txt — the single source of truth. That
        # pulls openskp from upstream's `main` branch, so CI always tests
        # against the same reader/writer local dev uses (the release workflows
        # pin a SHA instead, on purpose: installers must be reproducible; CI
        # should track the branch).
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -c "import PySide6, numpy, openskp, openskp.legacy; print('deps OK')"

      - name: Tests
        # The slow marker is long fuzz sweeps; the PR gate is the fast set,
        # same as the release gate. Offscreen so no test can accidentally
        # depend on a display. In batches, one process each: the fast suite
        # no longer fits in a runner's memory as one process (see
        # scripts/pytest_batches.py).
        env:
          QT_QPA_PLATFORM: offscreen
          TEST_BATCH: ${{ matrix.batch }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          # Exactly the upstream runner's six interleaved file batches,
          # executed on separate runners to verify the full suite in parallel.
          files = sorted(str(p) for p in Path("tests").glob("test_*.py"))
          chunk = files[int(os.environ["TEST_BATCH"])::6]
          result = subprocess.run([
              sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider",
              "-m", "not slow", *chunk,
          ])
          raise SystemExit(result.returncode)
          PY
